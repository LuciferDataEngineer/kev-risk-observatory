name: Pipeline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Test data contracts, history and rollback
        run: python -m unittest discover -s tests -v
      - name: Run the reproducible offline example
        run: >-
          python -m kev_risk run --data-dir demo-data --as-of 2026-10-29
          --kev-file tests/fixtures/kev.json --epss-file tests/fixtures/epss.csv
